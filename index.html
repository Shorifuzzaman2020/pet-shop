<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Shop</title>
    <!-- tailwind css link -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- daisy ui link -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&display=swap" rel="stylesheet">
    <!-- font awesome link -->
    <script src="https://kit.fontawesome.com/889e400bff.js" crossorigin="anonymous"></script>
    <!-- css link for google font -->
     <style>
        .adlam-display-regular {
            font-family: "ADLaM Display", serif;
    
        }
     </style>
</head>
<body class="adlam-display-regular">
    <header>
        <nav class="mx-4 lg:mx-auto flex items-center justify-between lg:justify-around pt-3 pb-2 bg-[#FFF9F4]">
            <div class="flex items-center gap-2">
                <div>
                    <img src="c1-assets/logo-header.png" alt="">
                </div>
                <div class="hidden lg:block">
                    <h2 class="text-xl font-bold">Browse<span class="text-orange-300">4</span>Pets</h2>
                </div>
            </div>
            <div class="hidden lg:block">
                <ul class="flex items-center gap-4">
                    <li>Find a Pet</li>
                    <li>Breeds</li>
                    <li>Contact Us</li>
                </ul>
            </div>
            <div class="hidden lg:flex items-center gap-4">
                <div>
                    <i class="fa-regular fa-bell"></i>
                </div>
                <div>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div>
                    <button class="border border-[#FFDC26] rounded-lg w-28 h-12">Login</button>
                </div>
                <div>
                    <button class="rounded-lg bg-[#FFDC26] text-black w-32 h-12">Register</button>
                </div>
            </div>
            <div class="block lg:hidden">
                <div>
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>
    <main>

    </main>
    <footer>

    </footer>
